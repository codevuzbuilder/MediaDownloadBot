name: Telegram bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg o'rnatish
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Kutubxonalar
        run: pip install -U -r requirements.txt

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          RUN_SECONDS: "20700"
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          python bot.py

      - name: Holatni saqlash (offset, sozlamalar)
        if: always()
        run: |
          if [ -d data ]; then
            git config user.name "telegram-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A data
            if ! git diff --cached --quiet; then
              git commit -m "auto: bot holati yangilandi [skip ci]"
              git pull --rebase
              git push
            fi
          else
            echo "data papkasi yo'q, saqlash o'tkazib yuborildi"
          fi