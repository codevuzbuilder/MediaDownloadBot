name: Telegram bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg o'rnatish
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RUN_SECONDS: "20700"
        run: python bot.py

      - name: Holatni saqlash (sozlamalar, offset)
        if: always()
        run: |
          git config user.name "telegram-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "auto: bot holati yangilandi [skip ci]"
            git pull --rebase
            git push
          fi